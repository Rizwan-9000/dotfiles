music_directory		"/home/tangerine/songs/"
playlist_directory	"/home/tangerine/songs/"
db_file 		"~/.config/mpd/mpd.db" #you have to create this manually, delete this comment while using

auto_update "yes"
bind_to_address "127.0.0.1"
restore_paused "yes"
max_output_buffer_size "16384"

audio_output {
        type            "pulse"
        name            "pulse audio"
}

audio_output {
       type	"fifo"
       name	"Visualizer feed"
       path	"/tmp/mpd.fifo"
       format	"44100:16:2"
}
